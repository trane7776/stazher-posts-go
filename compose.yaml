name: stazher-posts-go

services:
  app:
    build: .
    image: stazher-posts-go:local
    command: ["-storage=postgres"]
    environment:
      DATABASE_URL: "postgres://posts:posts@db:5432/posts?sslmode=disable"
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: posts
      POSTGRES_DB: posts
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
